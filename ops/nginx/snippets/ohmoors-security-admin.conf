# Security headers for the news admin location (/admin/news/).
# nginx only inherits add_header from the server block if a location defines no add_header itself.
# Same headers as ohmoors-security.conf, except script-src still allows 'unsafe-inline' because the
# admin UI (scripts/news_admin.py) keeps one large inline script. Do not combine both snippets in one
# location: two Content-Security-Policy headers would be intersected by the browser.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://class.kryptikk.de; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
