# Security headers for the primary HTTPS virtual host.
# nginx only inherits add_header from the server block if a location defines no add_header itself.
# Every location with its own add_header must therefore include this snippet again.
# script-src erlaubt kein 'unsafe-inline': Seiten-JS liegt in static/js/. Das Admin-UI nutzt
# ohmoors-security-admin.conf (dort bleibt 'unsafe-inline' erlaubt).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://class.kryptikk.de; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
