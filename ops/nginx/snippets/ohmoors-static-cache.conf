# Cache static assets for one hour. events.json is handled separately.
location ~* \.(?:css|js|mjs|ico|gif|jpe?g|png|svg|webp|avif|pdf)$ {
    # add_header below disables inheritance from the server block, so repeat the security headers.
    include /etc/nginx/snippets/ohmoors-security.conf;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}
