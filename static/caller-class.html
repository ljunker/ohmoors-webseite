<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Ohmoor Squeezers e.V. - Caller-Ansicht</title>
  </head>
  <body class="caller-page">
    <header class="caller-header">
      <strong id="caller-class-name">Class</strong>
      <span id="caller-stand" class="muted"></span>
      <span id="caller-count" class="muted"></span>
      <label><input type="checkbox" id="caller-only-taught" /> Nur gelernte</label>
    </header>
    <p id="caller-status" class="muted">Wird geladen…</p>
    <ol id="caller-list" class="caller-list"></ol>
    <script src="js/news-render.js" defer></script>
    <script src="js/caller-class.js" defer></script>
  </body>
</html>
